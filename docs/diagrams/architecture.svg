<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8b949e"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#3fb950"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#f85149"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#0d1117"/>
  <text x="30" y="40" fill="#e6edf3" font-size="22" font-weight="600">Multi-Region DR — active/passive with automated failover</text>
  <text x="30" y="64" fill="#8b949e" font-size="13">measured RTO 4m10s · measured RPO ~5s · failback manual and two-person approved</text>

  <!-- users -->
  <circle cx="52" cy="150" r="24" fill="none" stroke="#8b949e" stroke-width="1.5"/>
  <text x="52" y="155" fill="#c9d1d9" font-size="11" text-anchor="middle">users</text>

  <!-- Front Door -->
  <rect x="110" y="100" width="230" height="110" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="225" y="126" fill="#58a6ff" font-size="13" font-weight="600" text-anchor="middle">Azure Front Door</text>
  <text x="225" y="146" fill="#c9d1d9" font-size="11" text-anchor="middle">priority 1 → primary</text>
  <text x="225" y="164" fill="#c9d1d9" font-size="11" text-anchor="middle">priority 2 → secondary</text>
  <text x="225" y="182" fill="#8b949e" font-size="10" text-anchor="middle">HEAD /health every 15s</text>
  <text x="225" y="198" fill="#8b949e" font-size="10" text-anchor="middle">failover at the edge, ~1–5s</text>
  <line x1="78" y1="150" x2="106" y2="150" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- primary region -->
  <rect x="400" y="70" width="330" height="200" rx="10" fill="none" stroke="#3fb950" stroke-width="1.4"/>
  <text x="416" y="92" fill="#3fb950" font-size="12" font-weight="600">PRIMARY · centralindia</text>
  <rect x="416" y="104" width="298" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="430" y="126" fill="#c9d1d9" font-size="11">App Service P1v3 × 3 · zone redundant</text>
  <rect x="416" y="146" width="298" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="430" y="168" fill="#c9d1d9" font-size="11">Azure SQL S1 · zone redundant · read scale</text>
  <rect x="416" y="188" width="142" height="30" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="430" y="208" fill="#c9d1d9" font-size="11">Storage GRS</text>
  <rect x="570" y="188" width="144" height="30" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="584" y="208" fill="#c9d1d9" font-size="11">Key Vault (RBAC)</text>
  <text x="416" y="242" fill="#6e7681" font-size="10">failover group listener: *.database.windows.net</text>
  <text x="416" y="258" fill="#6e7681" font-size="10">app connects to the listener, never a server</text>
  <line x1="344" y1="140" x2="396" y2="140" stroke="#3fb950" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- secondary region -->
  <rect x="400" y="320" width="330" height="180" rx="10" fill="none" stroke="#d29922" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="416" y="342" fill="#d29922" font-size="12" font-weight="600">SECONDARY · southindia (warm standby)</text>
  <rect x="416" y="354" width="298" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="430" y="376" fill="#c9d1d9" font-size="11">App Service P1v3 × 1 → 3 on failover</text>
  <rect x="416" y="396" width="298" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="430" y="418" fill="#c9d1d9" font-size="11">SQL geo-secondary (read-only until promoted)</text>
  <rect x="416" y="438" width="142" height="30" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="430" y="458" fill="#c9d1d9" font-size="11">Storage GRS</text>
  <rect x="570" y="438" width="144" height="30" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="584" y="458" fill="#c9d1d9" font-size="11">Key Vault</text>
  <line x1="344" y1="180" x2="396" y2="380" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- replication -->
  <path d="M 565 222 C 700 280 700 340 565 396" fill="none" stroke="#a371f7" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="712" y="312" fill="#a371f7" font-size="11" font-weight="600">continuous async</text>
  <text x="712" y="328" fill="#a371f7" font-size="11">replication ≈5s RPO</text>

  <!-- orchestrator -->
  <rect x="830" y="70" width="340" height="210" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="1000" y="96" fill="#58a6ff" font-size="13" font-weight="600" text-anchor="middle">DR ORCHESTRATOR · westeurope</text>
  <text x="846" y="118" fill="#8b949e" font-size="10">third region on purpose: survives either outage</text>
  <rect x="846" y="130" width="308" height="42" rx="5" fill="#0b1020" stroke="#30363d"/>
  <text x="858" y="148" fill="#c9d1d9" font-size="11">Function App · timer every 20s</text>
  <text x="858" y="164" fill="#6e7681" font-size="10">3 failures + 60s grace + re-probe → failover</text>
  <rect x="846" y="180" width="308" height="42" rx="5" fill="#0b1020" stroke="#30363d"/>
  <text x="858" y="198" fill="#c9d1d9" font-size="11">HTTP · manual failover / failback</text>
  <text x="858" y="214" fill="#6e7681" font-size="10">allow-list + approver + data-loss ack</text>
  <rect x="846" y="230" width="308" height="38" rx="5" fill="#0b1020" stroke="#a371f7"/>
  <text x="858" y="254" fill="#a371f7" font-size="11">Cosmos DB state doc · _etag = one failover only</text>

  <!-- orchestrator actions -->
  <path d="M 830 150 C 760 150 740 120 734 120" fill="none" stroke="#f85149" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M 830 200 C 760 200 750 420 734 420" fill="none" stroke="#3fb950" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="742" y="60" fill="#f85149" font-size="10">1. fence + 2. promote SQL</text>
  <text x="742" y="490" fill="#3fb950" font-size="10">4. scale standby 1→3</text>
  <path d="M 1000 280 C 1000 300 940 120 900 130" fill="none" stroke="#58a6ff" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="1010" y="300" fill="#58a6ff" font-size="10">5. flip AFD priorities → 6. verify</text>

  <!-- state machine -->
  <rect x="60" y="560" width="1080" height="160" rx="10" fill="#0b1020" stroke="#30363d"/>
  <text x="80" y="588" fill="#e6edf3" font-size="13" font-weight="600">Failover state machine</text>
  <g font-size="11">
    <rect x="80" y="602" width="110" height="30" rx="15" fill="#161b22" stroke="#3fb950"/>
    <text x="135" y="622" fill="#3fb950" text-anchor="middle">HEALTHY</text>
    <rect x="230" y="602" width="110" height="30" rx="15" fill="#161b22" stroke="#d29922"/>
    <text x="285" y="622" fill="#d29922" text-anchor="middle">DEGRADED</text>
    <rect x="380" y="602" width="130" height="30" rx="15" fill="#161b22" stroke="#58a6ff"/>
    <text x="445" y="622" fill="#58a6ff" text-anchor="middle">FAILING_OVER</text>
    <rect x="550" y="602" width="120" height="30" rx="15" fill="#161b22" stroke="#3fb950"/>
    <text x="610" y="622" fill="#3fb950" text-anchor="middle">FAILED_OVER</text>
    <rect x="710" y="602" width="130" height="30" rx="15" fill="#161b22" stroke="#d29922"/>
    <text x="775" y="622" fill="#d29922" text-anchor="middle">FAILING_BACK</text>
    <rect x="880" y="602" width="150" height="30" rx="15" fill="#161b22" stroke="#f85149"/>
    <text x="955" y="622" fill="#f85149" text-anchor="middle">FAILOVER_FAILED</text>
  </g>
  <g stroke="#8b949e" stroke-width="1.3" marker-end="url(#a)" fill="none">
    <line x1="190" y1="617" x2="226" y2="617"/>
    <line x1="340" y1="617" x2="376" y2="617"/>
    <line x1="510" y1="617" x2="546" y2="617"/>
    <line x1="670" y1="617" x2="706" y2="617"/>
  </g>
  <path d="M 775 632 C 775 660 445 668 445 636" fill="none" stroke="#3fb950" stroke-width="1.3" marker-end="url(#ag)"/>
  <text x="590" y="676" fill="#3fb950" font-size="10">manual, approved</text>
  <path d="M 480 600 C 480 570 940 570 950 598" fill="none" stroke="#f85149" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="700" y="568" fill="#f85149" font-size="10">any step fails → human required</text>
  <text x="80" y="700" fill="#6e7681" font-size="10">Transitions not in the table are rejected. FAILED_OVER → HEALTHY does not exist: failback must go through FAILING_BACK, on purpose.</text>
</svg>
